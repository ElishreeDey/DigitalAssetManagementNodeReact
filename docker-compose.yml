services:

  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: EliPostgres
      POSTGRES_DB: user_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js / Express / Sequelize) ─────────────────────────────────
  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      # Override DB_HOST to point at the postgres service instead of the Windows host
      DB_HOST: postgres
    volumes:
      - ./backend:/app
      # Anonymous volume prevents Windows host node_modules from overwriting the container's Linux modules
      - /app/node_modules
      - /app/dist
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (React / Vite) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
