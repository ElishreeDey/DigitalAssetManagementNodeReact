services:

  postgres:
    volumes:
      # Bind mount to Windows drive — data persists across Docker reinstalls
      - ./pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      target: production
    # No source bind mounts in production — image is self-contained
    volumes: []
    environment:
      NODE_ENV: production
      DB_HOST: postgres

  worker:
    build:
      context: ./backend
      target: production
    command: npm run worker:start
    volumes: []
    environment:
      NODE_ENV: production
      DB_HOST: postgres

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Relative URL — nginx proxies /api/v1/ to the backend container internally.
        # Using a relative URL means no hardcoded hostname in the built JS bundle.
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:80"
    # No source bind mounts in production
    volumes: []
    depends_on:
      - backend
